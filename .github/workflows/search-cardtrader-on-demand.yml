name: Search CardTrader on demand

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Identificador único do job
        required: true
        type: string
      species_number:
        description: Número da Pokédex Nacional
        required: true
        type: string
      api_identifier:
        description: Identificador da forma; vazio para normal
        required: false
        default: ""
        type: string
      pokemon_name:
        description: Nome para exibição
        required: true
        type: string
      force_refresh:
        description: Ignorar cache recente
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cardtrader-on-demand
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git publisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate CardTrader token
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: |
          if [ -z "$CARDTRADER_TOKEN" ]; then
            echo "CARDTRADER_TOKEN não configurado"
            exit 1
          fi

      - name: Run exhaustive on-demand search
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
          SPECIES_NUMBER: ${{ inputs.species_number }}
          API_IDENTIFIER: ${{ inputs.api_identifier }}
          POKEMON_NAME: ${{ inputs.pokemon_name }}
          FORCE_REFRESH: ${{ inputs.force_refresh }}
          PROGRESS_COMMIT_EVERY: "25"
          CACHE_TTL_SECONDS: "604800"
          MARKETPLACE_DELAY: "1.05"
          INDEX_REQUEST_DELAY: "0.08"
          INDEX_MAX_AGE_DAYS: "1"
        run: python tools/search_cardtrader_on_demand.py
