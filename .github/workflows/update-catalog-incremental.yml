name: Update catalog incrementally (manual legacy)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokemon-card-catalog-incremental
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate CardTrader token
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: |
          if [ -z "$CARDTRADER_TOKEN" ]; then
            echo "CARDTRADER_TOKEN não configurado"
            exit 1
          fi

      - name: Run legacy exhaustive batch manually
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          BATCH_SIZE: "10"
          MAX_MARKETPLACE_CALLS: "200"
          MARKETPLACE_DELAY: "1.05"
          INDEX_REQUEST_DELAY: "0.08"
          INDEX_MAX_AGE_DAYS: "1"
        run: python tools/update_catalog_cardtrader_v4.py

      - name: Commit manual legacy progress
        run: |
          if git diff --quiet -- card_prices.json catalog_progress.json cardtrader_blueprint_index.json; then
            echo "Nenhuma alteração."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card_prices.json catalog_progress.json
          if [ -f cardtrader_blueprint_index.json ]; then git add cardtrader_blueprint_index.json; fi
          git commit -m "Atualiza lote legado CardTrader manual"
          git push
