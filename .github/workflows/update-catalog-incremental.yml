name: Update catalog incrementally

on:
  push:
    branches: ["main"]
    paths:
      - "tools/update_catalog_incremental.py"
      - ".github/workflows/update-catalog-incremental.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: pokemon-card-catalog-incremental
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3

      - name: Capture current LigaPokemon health
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = json.loads(Path('card_prices.json').read_text(encoding='utf-8'))
          entries = root.get('pokemon', [])
          liga_cards = [c for e in entries for c in e.get('cards', []) if str(c.get('source','')).lower() == 'ligapokemon']
          liga_filled = sum(1 for e in entries if any(str(c.get('source','')).lower() == 'ligapokemon' for c in e.get('cards', [])))
          Path('/tmp/catalog_before.json').write_text(json.dumps({'filled': liga_filled, 'cards': len(liga_cards)}))
          print(f'Antes: {liga_filled} entradas LigaPokemon / {len(liga_cards)} cartas LigaPokemon')
          PY

      - name: Update one species slowly
        env:
          BATCH_SIZE: "1"
          REQUEST_DELAY: "15"
          MAX_CARD_DETAIL_REQUESTS: "3"
        run: python tools/update_catalog_incremental.py

      - name: Validate LigaPokemon-only catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('/tmp/catalog_before.json').read_text())
          root = json.loads(Path('card_prices.json').read_text(encoding='utf-8'))
          entries = root.get('pokemon', [])
          if not entries:
              raise SystemExit('ERRO: catálogo sem entradas')
          invalid = [c for e in entries for c in e.get('cards', []) if str(c.get('source','')).lower() != 'ligapokemon']
          if invalid:
              raise SystemExit(f'ERRO: ainda existem {len(invalid)} cartas de fonte diferente da LigaPokemon')
          filled = sum(1 for e in entries if e.get('cards'))
          cards = sum(len(e.get('cards', [])) for e in entries)
          if filled < before['filled']:
              raise SystemExit(f'ERRO: entradas LigaPokemon caíram de {before["filled"]} para {filled}')
          if cards < before['cards']:
              raise SystemExit(f'ERRO: cartas LigaPokemon caíram de {before["cards"]} para {cards}')
          progress = json.loads(Path('catalog_progress.json').read_text(encoding='utf-8'))
          blocked = progress.get('stoppedByLigaBlock')
          print(f'Depois: {filled} entradas LigaPokemon / {cards} cartas; modo {progress.get("mode")}; pendentes {progress.get("missingEntriesRemaining")}; bloqueado={blocked}')
          if blocked:
              print(f'Consulta encerrada de forma conservadora por HTTP {progress.get("blockedHttpStatus")} em {progress.get("blockedEntryName")}; cursor não avançou.')
          PY

      - name: Commit progress and catalog
        run: |
          if git diff --quiet -- card_prices.json catalog_progress.json; then
            echo "Nenhuma alteração neste lote."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card_prices.json catalog_progress.json
          git commit -m "Atualiza catálogo LigaPokemon em modo conservador"
          git push
