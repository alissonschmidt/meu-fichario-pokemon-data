name: Populate featured cards

on:
  push:
    branches: ["main"]
    paths:
      - "tools/populate_featured_cards.py"
      - ".github/workflows/populate-featured-cards.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: populate-featured-cards
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harden TCG API pagination
        run: |
          # A API às vezes retorna HTTP 500 persistente em uma página grande específica.
          # Reduzimos a página para mudar os limites da consulta e aumentamos as tentativas.
          sed -i 's/PAGE_SIZE = 250/PAGE_SIZE = 200/' tools/populate_featured_cards.py
          sed -i 's/def fetch_json(url, retries=6):/def fetch_json(url, retries=10):/' tools/populate_featured_cards.py

      - name: Populate 1025 base Pokemon first
        env:
          PYTHONUNBUFFERED: "1"
        run: python tools/populate_featured_cards.py --phase base

      - name: Validate base catalog
        run: |
          python - <<'PY'
          import json
          data=json.load(open('featured_cards.json',encoding='utf-8'))
          base=[e for e in data['pokemon'] if 'apiIdentifier' not in e]
          assert len(base)==1025, f'Esperado 1025, recebido {len(base)}'
          assert data.get('stats',{}).get('phase')=='base-complete'
          print('Base validada:', len(base))
          PY

      - name: Commit base catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add featured_cards.json
          if git diff --cached --quiet; then
            echo "Sem mudanças na fase base."
          else
            git commit -m "Popula cartas em destaque dos 1025 Pokémon base"
            git push
          fi

      - name: Rebase after base commit
        run: git pull --rebase origin main

      - name: Populate Mega, Shiny and other forms
        env:
          PYTHONUNBUFFERED: "1"
        run: python tools/populate_featured_cards.py --phase forms

      - name: Validate forms catalog
        run: |
          python - <<'PY'
          import json
          data=json.load(open('featured_cards.json',encoding='utf-8'))
          base=[e for e in data['pokemon'] if 'apiIdentifier' not in e]
          forms=[e for e in data['pokemon'] if 'apiIdentifier' in e]
          assert len(base)==1025
          assert data.get('stats',{}).get('phase')=='forms-complete'
          print('Base:',len(base),'Formas:',len(forms))
          PY

      - name: Commit forms catalog
        run: |
          git add featured_cards.json
          if git diff --cached --quiet; then
            echo "Sem mudanças na fase de formas."
          else
            git commit -m "Adiciona cartas em destaque de Mega Shiny e outras formas"
            git push
          fi
